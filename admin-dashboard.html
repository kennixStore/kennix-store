<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KENNIX Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:Arial;background:#f5f3ff;margin:0;padding:16px;color:#222}
header{background:#5427a8;color:white;padding:20px;border-radius:12px}
.card{background:white;padding:16px;margin:18px 0;border-radius:12px}
input,textarea,select,button{box-sizing:border-box;width:100%;padding:12px;margin:7px 0;border-radius:7px;border:1px solid #ccc}
button{background:#022c22;color:#d4af37;border:0;font-weight:bold;cursor:pointer}
.product,.order{border-bottom:1px solid #ddd;padding:14px 0;overflow-wrap:anywhere}
img{max-width:100%;height:100px;object-fit:cover;display:block}
.editBtn{background:#1769aa}
.inventory-row{border-bottom:1px solid #e4e9e3;padding:12px 0;display:grid;gap:6px}
.inventory-row button{margin:3px 0}
.inventory-meta{font-size:13px;color:#56645b}
.deleteBtn{background:#c62828}
.status{background:#f5f3ff}
.small{font-size:14px;color:#555}
</style>
</head>
<body><header>
<h1>KENNIX Admin</h1>
<p>Manage your fashion store</p>
<button id="logout">Log Out</button>
</header><section class="card">
<h2>📦 Customer Orders</h2>
<button id="refreshOrders">Refresh Orders</button>
<div id="orders">Loading orders...</div>
</section><section class="card">
<h2>➕ Add New Product</h2>
<form id="productForm">
<input id="name" placeholder="Product name" required><select id="category" required>
<option value="">Choose category</option>
<option>Clothes</option>
<option>Shoes</option>
<option>Bags</option>
<option>Accessories</option>
</select><textarea id="description" placeholder="Product description" required></textarea><input id="price" type="number" min="1" placeholder="Price in naira" required>
<label>Product picture</label>
<input id="image" type="file" accept="image/*" required>
<button type="submit">Upload Product</button>
<p id="message"></p>
</form>
</section><section class="card">
<h2>🛍️ Your Products</h2>
<div id="products">Loading products...</div>
</section>
<section class="card" id="variant-inventory">
<h2>Variant Stock Inventory</h2>
<form id="variantForm">
<label for="variantProduct">Product</label><select id="variantProduct" required><option value="">Loading products...</option></select>
<label for="variantColor">Colour</label><input id="variantColor" placeholder="e.g. Black" required>
<label for="variantSize">Size</label><input id="variantSize" placeholder="e.g. Medium or One Size" required>
<label for="variantStock">Stock quantity</label><input id="variantStock" type="number" min="0" step="1" placeholder="Available quantity" required>
<label for="variantPrice">Variant price (optional)</label><input id="variantPrice" type="number" min="0" step="1" placeholder="Leave blank to use product price">
<button id="saveVariant" type="submit">Save Stock Option</button>
<p id="variantMessage" class="small"></p>
</form>
<h3>Existing Stock Options</h3><div id="variantList">Loading inventory...</div>
</section>
<script>
const SUPABASE_URL = "https://shdstohkbpvoxjtghsob.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_Izj2iOacJqMcoso2OeLyzA_gghnKnxo";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);

const form = document.getElementById("productForm");
const message = document.getElementById("message");

async function checkLogin() {
  const { data, error } = await db.auth.getSession();

  if (error || !data.session) {
    location.href = "admin.html";
    return false;
  }
  return true;
}

/* CUSTOMER ORDERS */

async function loadOrders() {
  const box = document.getElementById("orders");
  box.textContent = "Loading orders...";

  const { data, error } = await db
    .from("orders")
    .select("*")
    .order("created_at", { ascending: false });

  if (error) {
    box.textContent = "Could not load orders: " + error.message;
    return;
  }

  box.replaceChildren();

  if (!data.length) {
    box.textContent = "No customer orders yet.";
    return;
  }

  data.forEach(order => {
    const item = document.createElement("div");
    item.className = "order";

    const title = document.createElement("h3");
    title.textContent = "Order #" + order.id;

    const details = document.createElement("p");
    details.textContent =
      "Customer: " + order.customer_name +
      "\\nPhone: " + order.customer_phone +
      "\\nAddress: " + order.delivery_address +
      "\\nProduct: " + order.product_name +
      "\\nQuantity: " + order.quantity +
      "\\nUnit price: ₦" + Number(order.unit_price).toLocaleString("en-NG") +
      "\\nTotal: ₦" + Number(order.total_amount).toLocaleString("en-NG");

    details.style.whiteSpace = "pre-line";

    const date = document.createElement("p");
    date.className = "small";
    date.textContent = "Ordered: " + new Date(order.created_at).toLocaleString();

    const label = document.createElement("label");
    label.textContent = "Order status";

    const status = document.createElement("select");
    status.className = "status";

    ["Pending", "Processing", "Shipped", "Delivered", "Cancelled"]
      .forEach(value => {
        const option = document.createElement("option");
        option.value = value;
        option.textContent = value;
        status.appendChild(option);
      });

    status.value = order.status;

    const save = document.createElement("button");
    save.textContent = "Update Order Status";

    save.onclick = async () => {
      save.disabled = true;
      save.textContent = "Saving...";

      const { error } = await db
        .from("orders")
        .update({ status: status.value })
        .eq("id", order.id);

      save.disabled = false;
      save.textContent = "Update Order Status";

      if (error) {
        alert("Status update failed: " + error.message);
        return;
      }

      alert("Order #" + order.id + " updated to " + status.value + ".");
      loadOrders();
    };

    item.append(title, details, date, label, status, save);
    box.appendChild(item);
  });
}

document.getElementById("refreshOrders").onclick = loadOrders;

/* LOAD PRODUCTS */

async function loadProducts() {
  const box = document.getElementById("products");
  box.textContent = "Loading products...";

  const { data, error } = await db
    .from("products")
    .select("*")
    .order("id", { ascending: false });

  if (error) {
    box.textContent = "Error: " + error.message;
    return;
  }

  box.replaceChildren();

  if (!data.length) {
    box.textContent = "No products yet.";
    return;
  }

  data.forEach(p => {
    const item = document.createElement("div");
    item.className = "product";

    if (p.Image_Url) {
      const img = document.createElement("img");
      img.src = p.Image_Url;
      img.alt = p.Name || "Product";
      item.appendChild(img);
    }

    const title = document.createElement("h3");
    title.textContent = p.Name || "Unnamed product";

    const category = document.createElement("p");
    category.textContent = p.Category || "";

    const description = document.createElement("p");
    description.textContent = p.Description || "";

    const price = document.createElement("p");
    price.textContent = "₦" + Number(p.Price || 0).toLocaleString("en-NG");

    const editBtn = document.createElement("button");
    editBtn.textContent = "Edit Product ✏️";
    editBtn.className = "editBtn";
    editBtn.onclick = () => editProduct(p);

    const deleteBtn = document.createElement("button");
    deleteBtn.textContent = "Delete Product 🗑️";
    deleteBtn.className = "deleteBtn";

    deleteBtn.onclick = async () => {
      if (!confirm('Delete "' + p.Name + '" permanently?')) return;

      const { error } = await db
        .from("products")
        .delete()
        .eq("id", p.id);

      if (error) {
        alert("Delete failed: " + error.message);
        return;
      }

      alert("Product deleted!");
      loadProducts();
    };

    item.append(title, category, description, price, editBtn, deleteBtn);
    box.appendChild(item);
  });
}

/* EDIT PRODUCT */

async function editProduct(p) {
  if (!(await checkLogin())) return;

  const name = prompt("Product name:", p.Name || "");
  if (name === null) return;

  if (!name.trim()) {
    alert("Product name cannot be empty.");
    return;
  }

  const category = prompt(
    "Category: Clothes, Shoes, Bags, or Accessories",
    p.Category || "Clothes"
  );
  if (category === null) return;

  const validCategories = ["Clothes", "Shoes", "Bags", "Accessories"];

  if (!validCategories.includes(category.trim())) {
    alert("Enter a valid category.");
    return;
  }

  const description = prompt("Product description:", p.Description || "");
  if (description === null) return;

  const priceText = prompt("Price in naira:", String(p.Price || ""));
  if (priceText === null) return;

  const price = Number(priceText);

  if (!Number.isFinite(price) || price <= 0) {
    alert("Enter a valid price greater than zero.");
    return;
  }

  let imageUrl = p.Image_Url || "";

  if (confirm("Change the product picture?")) {
    const file = await chooseImage();
    if (!file) return;

    if (!file.type.startsWith("image/") || file.size > 5 * 1024 * 1024) {
      alert("Choose an image under 5 MB.");
      return;
    }

    const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, "_");
    const imagePath = Date.now() + "_" + safeName;

    const { error: uploadError } = await db.storage
      .from("product-images")
      .upload(imagePath, file);

    if (uploadError) {
      alert("Image upload failed: " + uploadError.message);
      return;
    }

    const { data: imageData } = db.storage
      .from("product-images")
      .getPublicUrl(imagePath);

    imageUrl = imageData.publicUrl;
  }

  const { error } = await db
    .from("products")
    .update({
      Name: name.trim(),
      Category: category.trim(),
      Description: description.trim(),
      Price: price,
      Image_Url: imageUrl
    })
    .eq("id", p.id);

  if (error) {
    alert("Update failed: " + error.message);
    return;
  }

  alert("Product updated successfully!");
  loadProducts();
}

function chooseImage() {
  return new Promise(resolve => {
    const input = document.createElement("input");
    input.type = "file";
    input.accept = "image/*";
    input.onchange = () => resolve(input.files[0] || null);
    input.click();
  });
}

/* ADD PRODUCT */

form.addEventListener("submit", async event => {
  event.preventDefault();

  if (!(await checkLogin())) return;

  const name = document.getElementById("name").value.trim();
  const category = document.getElementById("category").value;
  const description = document.getElementById("description").value.trim();
  const price = Number(document.getElementById("price").value);
  const file = document.getElementById("image").files[0];

  if (!file || !file.type.startsWith("image/")) {
    message.textContent = "Choose a valid image.";
    return;
  }

  if (file.size > 5 * 1024 * 1024) {
    message.textContent = "Image must be under 5 MB.";
    return;
  }

  message.textContent = "Uploading product...";

  const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, "_");
  const imagePath = Date.now() + "_" + safeName;

  const { error: uploadError } = await db.storage
    .from("product-images")
    .upload(imagePath, file);

  if (uploadError) {
    message.textContent = "Image upload failed: " + uploadError.message;
    return;
  }

  const { data: imageData } = db.storage
    .from("product-images")
    .getPublicUrl(imagePath);

  const { error: insertError } = await db
    .from("products")
    .insert({
      Name: name,
      Category: category,
      Description: description,
      Price: price,
      Image_Url: imageData.publicUrl,
      Is_active: true
    });

  if (insertError) {
    message.textContent = "Product save failed: " + insertError.message;
    return;
  }

  form.reset();
  message.textContent = "Product added successfully!";
  loadProducts();
});

/* LOG OUT */

document.getElementById("logout").addEventListener("click", async () => {
  await db.auth.signOut();
  location.href = "admin.html";
});


/* VARIANT STOCK INVENTORY */
const variantForm=document.getElementById("variantForm");
const variantMessage=document.getElementById("variantMessage");
const variantProduct=document.getElementById("variantProduct");
const variantList=document.getElementById("variantList");
let adminProducts=[];

async function loadVariantProducts(){
  const {data,error}=await db.from("products").select("id,Name,Price").order("Name");
  if(error){variantProduct.innerHTML='<option value="">Could not load products</option>';variantMessage.textContent=error.message;return}
  adminProducts=data||[];
  variantProduct.replaceChildren();
  const first=document.createElement("option");first.value="";first.textContent="Choose a product";variantProduct.append(first);
  adminProducts.forEach(p=>{const o=document.createElement("option");o.value=p.id;o.textContent=p.Name||("Product #"+p.id);variantProduct.append(o)});
}
async function loadVariantInventory(){
  variantList.textContent="Loading inventory...";
  const {data,error}=await db.from("product_variants").select("id,product_id,color,size,stock_quantity,price,is_active").order("product_id").order("color").order("size");
  if(error){variantList.textContent="Could not load stock options: "+error.message;return}
  variantList.replaceChildren();
  if(!data?.length){variantList.textContent="No stock options added yet.";return}
  data.forEach(v=>{
    const product=adminProducts.find(p=>String(p.id)===String(v.product_id));
    const row=document.createElement("div");row.className="inventory-row";
    const title=document.createElement("strong");title.textContent=(product?.Name||("Product #"+v.product_id))+" — "+v.color+" / "+v.size;
    const meta=document.createElement("div");meta.className="inventory-meta";meta.textContent="Stock: "+v.stock_quantity+" · Price: "+(v.price==null?"Use product price":"₦"+Number(v.price).toLocaleString("en-NG"))+" · "+(v.is_active?"Active":"Inactive");
    const edit=document.createElement("button");edit.className="editBtn";edit.textContent="Edit stock option";
    edit.onclick=async()=>{
      const stockText=prompt("New stock quantity:",String(v.stock_quantity));if(stockText===null)return;
      if(!/^\\d+$/.test(stockText.trim())){alert("Enter a whole number of 0 or more.");return}
      const priceText=prompt("Variant price in naira (leave blank to use product price):",v.price==null?"":String(v.price));if(priceText===null)return;
      let price=null;if(priceText.trim()!==""){price=Number(priceText);if(!Number.isFinite(price)||price<0){alert("Enter a valid price.");return}}
      const {error:updateError}=await db.from("product_variants").update({stock_quantity:Number(stockText),price,is_active:true}).eq("id",v.id);
      if(updateError){alert("Could not update stock: "+updateError.message);return}
      loadVariantInventory();
    };
    const toggle=document.createElement("button");toggle.className="deleteBtn";toggle.textContent=v.is_active?"Deactivate option":"Activate option";
    toggle.onclick=async()=>{const {error:toggleError}=await db.from("product_variants").update({is_active:!v.is_active}).eq("id",v.id);if(toggleError){alert("Could not change option: "+toggleError.message);return}loadVariantInventory()};
    row.append(title,meta,edit,toggle);variantList.append(row);
  });
}
variantForm.addEventListener("submit",async event=>{
  event.preventDefault();if(!(await checkLogin()))return;
  const product_id=Number(variantProduct.value),color=document.getElementById("variantColor").value.trim(),size=document.getElementById("variantSize").value.trim(),stock_quantity=Number(document.getElementById("variantStock").value),priceText=document.getElementById("variantPrice").value.trim();
  if(!product_id||!color||!size||!Number.isInteger(stock_quantity)||stock_quantity<0){variantMessage.textContent="Choose a product and enter a colour, size and valid whole-number stock.";return}
  let price=null;if(priceText!==""){price=Number(priceText);if(!Number.isFinite(price)||price<0){variantMessage.textContent="Enter a valid variant price.";return}}
  const save=document.getElementById("saveVariant");save.disabled=true;variantMessage.textContent="Saving stock option...";
  const {error}=await db.from("product_variants").upsert({product_id,color,size,stock_quantity,price,is_active:true},{onConflict:"product_id,color,size"});
  save.disabled=false;
  if(error){variantMessage.textContent="Could not save. "+error.message;return}
  variantMessage.textContent="Stock option saved.";
  document.getElementById("variantColor").value="";document.getElementById("variantSize").value="";document.getElementById("variantStock").value="";document.getElementById("variantPrice").value="";
  await loadVariantInventory();
});

/* START */

(async () => {
  if (await checkLogin()) {
    loadProducts();
    loadOrders();
    await loadVariantProducts();
    await loadVariantInventory();
  }
})();
</script></body>
</html>
