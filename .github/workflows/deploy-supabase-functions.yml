name: Deploy KENNIX Supabase Functions

on:
  workflow_dispatch:
  push:
    paths:
      - 'supabase/functions/create-manual-transfer-order/**'
      - '.github/workflows/deploy-supabase-functions.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy KENNIX functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy create-manual-transfer-order track-order upload-payment-proof --project-ref shdstohkbpvoxjtghsob --no-verify-jwt --yes
