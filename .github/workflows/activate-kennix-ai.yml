name: Activate KENNIX AI

on:
  workflow_dispatch:
  push:
    paths:
      - 'supabase/functions/kennix-ai/index.ts'
      - '.github/workflows/activate-kennix-ai.yml'

permissions:
  contents: read

jobs:
  activate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: shdstohkbpvoxjtghsob
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      ENABLE_GROQ_FALLBACK: ${{ secrets.ENABLE_GROQ_FALLBACK }}
      GROQ_MODEL: ${{ secrets.GROQ_MODEL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check required credentials
        shell: bash
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || (echo "Missing GitHub secret: SUPABASE_ACCESS_TOKEN" && exit 1)
          test -n "$SUPABASE_PUBLISHABLE_KEY" || (echo "Missing GitHub secret: SUPABASE_PUBLISHABLE_KEY" && exit 1)

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Sync configured AI provider secrets (all optional)
        shell: bash
        run: |
          args=()
          [ -z "$GEMINI_API_KEY" ] || args+=("GEMINI_API_KEY=$GEMINI_API_KEY")
          [ -z "$OPENROUTER_API_KEY" ] || args+=("OPENROUTER_API_KEY=$OPENROUTER_API_KEY")
          [ -z "$GROQ_API_KEY" ] || args+=("GROQ_API_KEY=$GROQ_API_KEY")
          [ -z "$ENABLE_GROQ_FALLBACK" ] || args+=("ENABLE_GROQ_FALLBACK=$ENABLE_GROQ_FALLBACK")
          [ -z "$GROQ_MODEL" ] || args+=("GROQ_MODEL=$GROQ_MODEL")
          if [ "${#args[@]}" -gt 0 ]; then
            supabase secrets set "${args[@]}" --remote="$SUPABASE_PROJECT_ID" --yes
          else
            echo "No AI provider keys supplied; deploying health endpoint only."
          fi

      - name: Validate AI provider credentials without generating tokens
        shell: bash
        run: |
          set +e
          check_result() {
            label="$1"
            status="$2"
            body="$3"
            echo "$label HTTP status: ${status:-000}"
            if [ "$status" != "200" ]; then
              code=$(jq -r '.error.status // .error.code // .code // empty' "$body" 2>/dev/null | head -c 100)
              [ -z "$code" ] || echo "$label provider error code: $code"
            fi
          }

          if [ -n "$GEMINI_API_KEY" ]; then
            body=$(mktemp)
            status=$(curl -sS --max-time 15 -o "$body" -w "%{http_code}" \
              "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash-lite" \
              -H "x-goog-api-key: $GEMINI_API_KEY" || true)
            check_result "Gemini model metadata (no generation)" "$status" "$body"
            rm -f "$body"
          else
            echo "Gemini key: NOT CONFIGURED"
          fi

          if [ -n "$GROQ_API_KEY" ]; then
            body=$(mktemp)
            status=$(curl -sS --max-time 15 -o "$body" -w "%{http_code}" \
              "https://api.groq.com/openai/v1/models" \
              -H "Authorization: Bearer $GROQ_API_KEY" || true)
            check_result "Groq model catalogue (no generation)" "$status" "$body"
            model="${GROQ_MODEL:-openai/gpt-oss-20b}"
            if [ "$status" = "200" ]; then
              if jq -e --arg model "$model" '.data[]? | select(.id == $model)' "$body" >/dev/null 2>&1; then
                echo "Configured Groq model is listed: $model"
              else
                echo "Configured Groq model is NOT listed: $model"
              fi
            fi
            rm -f "$body"
          else
            echo "Groq key: NOT CONFIGURED"
          fi

          if [ -n "$OPENROUTER_API_KEY" ]; then
            body=$(mktemp)
            status=$(curl -sS --max-time 15 -o "$body" -w "%{http_code}" \
              "https://openrouter.ai/api/v1/key" \
              -H "Authorization: Bearer $OPENROUTER_API_KEY" || true)
            check_result "OpenRouter key validation (no generation)" "$status" "$body"
            if [ "$status" = "200" ]; then
              echo "OpenRouter free-tier flag: $(jq -r '.data.is_free_tier // "unknown"' "$body" 2>/dev/null)"
            fi
            rm -f "$body"
          else
            echo "OpenRouter key: NOT CONFIGURED"
          fi

      - name: Deploy KENNIX AI Edge Function
        shell: bash
        run: supabase functions deploy kennix-ai --remote="$SUPABASE_PROJECT_ID" --use-api --yes

      - name: Verify deployment health without using Gemini quota
        shell: bash
        run: |
          status=$(curl -sS -o /tmp/kennix-ai-check.json -w "%{http_code}" \
            "https://$SUPABASE_PROJECT_ID.supabase.co/functions/v1/kennix-ai" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY")
          cat /tmp/kennix-ai-check.json
          test "$status" = "200"

      - name: One-time authorized live response test
        shell: bash
        env:
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          body=$(mktemp)
          status=$(curl -sS --max-time 90 -o "$body" -w "%{http_code}" \
            "https://$SUPABASE_PROJECT_ID.supabase.co/functions/v1/kennix-ai" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -H "Content-Type: application/json" \
            --data '{"messages":[{"role":"user","content":"Reply with exactly: KENNIX AI test successful."}]}')
          echo "Live response test HTTP status: $status"
          jq '{reply,provider,error,diagnostic}' "$body" 2>/dev/null || head -c 1200 "$body"
          rm -f "$body"
          test "$status" = "200"
