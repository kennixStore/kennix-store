<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set Admin Password | KENNIX</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;font-family:Arial,sans-serif;background:linear-gradient(135deg,#fff,#eee7ff);color:#252044}
    .box{width:100%;max-width:420px;padding:30px 24px;background:#fff;border-radius:18px;box-shadow:0 8px 30px rgba(55,30,110,.12)}
    .logo{text-align:center;color:#6d28d9;font-size:32px;font-weight:800;letter-spacing:3px;margin-bottom:8px}
    h1{text-align:center;font-size:22px;margin:0 0 10px}
    .sub{text-align:center;color:#716b83;font-size:14px;line-height:1.5;margin-bottom:24px}
    label{display:block;font-size:14px;font-weight:700;margin:16px 0 7px}
    input{width:100%;padding:13px;border:1px solid #d8d1e8;border-radius:9px;font-size:16px}
    button{width:100%;margin-top:22px;padding:14px;border:0;border-radius:9px;background:#6d28d9;color:#fff;font-size:16px;font-weight:700}
    button:disabled{opacity:.6}
    #message{text-align:center;font-size:14px;line-height:1.5;overflow-wrap:anywhere}
    a{display:block;text-align:center;margin-top:20px;color:#6d28d9;text-decoration:none;font-size:14px}
    [hidden]{display:none!important}
  </style>
</head>
<body>
  <main class="box">
    <div class="logo">KENNIX</div>
    <h1>Create your admin password</h1>
    <p class="sub">Set a password for your KENNIX administrator access.</p>
    <form id="password-form" hidden>
      <label for="password">New password</label>
      <input id="password" type="password" autocomplete="new-password" minlength="8" placeholder="At least 8 characters" required>
      <label for="confirm-password">Confirm password</label>
      <input id="confirm-password" type="password" autocomplete="new-password" minlength="8" placeholder="Enter the password again" required>
      <button id="save-button" type="submit">Save password</button>
    </form>
    <p id="message" role="status">Checking your secure invitation link...</p>
    <a href="admin.html">Return to admin sign in</a>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://shdstohkbpvoxjtghsob.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_Izj2iOacJqMcoso2OeLyzA_gghnKnxo";
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
      auth: { detectSessionInUrl: true, persistSession: true, autoRefreshToken: true }
    });
    const form = document.getElementById("password-form");
    const message = document.getElementById("message");
    const saveButton = document.getElementById("save-button");
    let ready = false;

    async function checkLink() {
      const { data, error } = await db.auth.getSession();
      if (error) {
        message.textContent = "We couldn't verify this link: " + error.message;
        return;
      }
      if (data.session) {
        ready = true;
        form.hidden = false;
        message.textContent = "Your link is verified. Create your password below.";
        return;
      }
      message.textContent = "This password link is invalid or has expired. Ask the KENNIX owner to send a fresh setup link.";
    }

    db.auth.onAuthStateChange((event, session) => {
      if ((event === "PASSWORD_RECOVERY" || event === "SIGNED_IN" || event === "INITIAL_SESSION") && session && !ready) {
        ready = true;
        form.hidden = false;
        message.textContent = "Your link is verified. Create your password below.";
      }
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      if (!ready) return;
      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirm-password").value;
      if (password.length < 8) {
        message.textContent = "Use a password with at least 8 characters.";
        return;
      }
      if (password !== confirmPassword) {
        message.textContent = "The passwords do not match.";
        return;
      }
      saveButton.disabled = true;
      message.textContent = "Saving your password...";
      const { error } = await db.auth.updateUser({ password });
      saveButton.disabled = false;
      if (error) {
        message.textContent = "Password could not be saved: " + error.message;
        return;
      }
      message.textContent = "Password saved. You can now sign in to KENNIX Admin.";
      form.hidden = true;
      setTimeout(() => { window.location.href = "admin.html"; }, 1800);
    });

    checkLink();
  </script>
</body>
</html>
