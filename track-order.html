<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Track Your Order | KENNIX</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:20px;background:#022c22;color:#fff;font-family:Arial,sans-serif}
.container{max-width:520px;margin:45px auto;background:#064333;padding:25px;border-radius:14px}
h1{color:#d4af37;text-align:center}
.subtitle{text-align:center;color:#ddd;line-height:1.5}
label{display:block;margin-top:18px;margin-bottom:7px}
input{width:100%;padding:14px;border:1px solid #777;border-radius:7px;background:#fff;color:#111;font-size:16px}
button{width:100%;padding:14px;margin-top:20px;border:0;border-radius:7px;background:#d4af37;color:#111;font-weight:bold;font-size:16px}
#result{margin-top:25px}
.card{background:#022c22;padding:16px;border-radius:9px;margin-top:12px}
.status{color:#d4af37;font-weight:bold}
.timeline{margin:18px 0 22px;padding-left:4px}
.timeline h3{margin-bottom:14px}
.step{display:flex;gap:12px;position:relative;min-height:58px}
.step:not(:last-child):before{content:"";position:absolute;left:11px;top:25px;height:calc(100% - 1px);border-left:2px solid #45685d}
.step-dot{z-index:1;flex:0 0 24px;height:24px;border-radius:50%;border:2px solid #789087;background:#022c22}
.step.done .step-dot,.step.current .step-dot{border-color:#d4af37;background:#d4af37}
.step.current .step-dot{box-shadow:0 0 0 4px #d4af3733}
.step-text{padding:2px 0 16px}
.step-text strong{display:block}
.step-text small{color:#c7d5ce}
.step.cancelled .step-dot{border-color:#ff7777;background:#ff7777}
.item{padding:10px 0;border-bottom:1px solid #34594e}
.error{color:#ff9999}
a{color:#d4af37}
</style>
</head>
<body>
<div class="container">
<h1>KENNIX</h1>
<p class="subtitle">Track your order and check your payment status.</p>

<form id="trackingForm">
<label>Order Reference</label>
<input id="reference" placeholder="KNX-..." required>

<label>Phone Number Used During Checkout</label>
<input id="phone" type="tel" placeholder="Your phone number" required>

<button id="trackButton" type="submit">TRACK MY ORDER</button>
</form>

<div id="result"></div>
</div>

<script>
const SUPABASE_URL = "https://shdstohkbpvoxjtghsob.supabase.co";
const SUPABASE_KEY = "sb_publishable_Izj2iOacJqMcoso2OeLyzA_gghnKnxo";

const form = document.getElementById("trackingForm");
const result = document.getElementById("result");
const button = document.getElementById("trackButton");

const escapeHTML = value => String(value ?? "").replace(/[&<>"']/g, c => ({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
}[c]));

const paymentLabel = status => ({
  pending:"Pending Payment",
  under_review:"Payment Under Review",
  paid:"Payment Approved",
  rejected:"Payment Rejected"
}[status] || status);

form.addEventListener("submit", async e => {
  e.preventDefault();

  button.disabled = true;
  button.textContent = "Checking...";
  result.innerHTML = "";

  try {
    const response = await fetch(
      `${SUPABASE_URL}/functions/v1/track-order`,
      {
        method:"POST",
        headers:{
          "Content-Type":"application/json",
          "apikey":SUPABASE_KEY
        },
        body:JSON.stringify({
          order_reference:document.getElementById("reference").value.trim(),
          phone:document.getElementById("phone").value.trim()
        })
      }
    );

    const data = await response.json();

    if (!response.ok || !data.success) {
      throw new Error(data.error || "Unable to find your order.");
    }

    const order = data.order;
    const status = String(order.order_status || "Pending").toLowerCase();
    const paymentPaid = order.payment_status === "paid";
    const stages = [
      {name:"Order Placed", detail:"We have received your order."},
      {name:"Payment Confirmed", detail:"Your payment has been approved."},
      {name:"Processing", detail:"Your order is being prepared."},
      {name:"Shipped", detail:"Your order has been dispatched."},
      {name:"Delivered", detail:"Your order has been delivered."}
    ];
    const progress = status === "delivered" ? 4 :
      status === "shipped" ? 3 :
      status === "processing" ? 2 : 0;
    const cancelled = status === "cancelled";
    const paymentConfirmed = paymentPaid || progress >= 2;
    const timeline = stages.map((stage,index) => {
      const done = index === 0 || (index === 1 && paymentConfirmed) || index <= progress;
      const current = !cancelled && !done && (
        (index === 1 && !paymentConfirmed) ||
        (index === 2 && paymentConfirmed && progress < 2) ||
        (index === 3 && progress === 2) ||
        (index === 4 && progress === 3)
      );
      return `
        <div class="step ${done ? "done" : ""} ${current ? "current" : ""}">
          <span class="step-dot"></span>
          <div class="step-text">
            <strong>${escapeHTML(stage.name)}</strong>
            <small>${done ? "Completed" : current ? stage.detail : "Waiting for previous stage"}</small>
          </div>
        </div>`;
    }).join("");
    const items = (order.items || []).map(item => `
      <div class="item">
        <strong>${escapeHTML(item.product_name)}</strong><br>
        ${escapeHTML(item.variant_label || "")}<br>
        Quantity: ${escapeHTML(item.quantity)}
      </div>
    `).join("");

    result.innerHTML = `
      <div class="card">
        <h3>Order Progress</h3>
        ${cancelled ? '<p class="error"><strong>This order has been cancelled.</strong></p>' : ""}
        <div class="timeline">${timeline}</div>
        <h3>Order Details</h3>
        <p>Reference: <strong>${escapeHTML(order.reference)}</strong></p>
        <p>Customer: ${escapeHTML(order.customer_name)}</p>
        <p>Order Status: <span class="status">${escapeHTML(order.order_status)}</span></p>
        <p>Payment Status: <span class="status">${escapeHTML(paymentLabel(order.payment_status))}</span></p>
        ${order.payment_review_note ? `<p>Admin note: ${escapeHTML(order.payment_review_note)}</p>` : ""}
        <h3>Items Ordered</h3>
        ${items || "No items found."}
      </div>
    `;

  } catch(error) {
    result.innerHTML = `<p class="error">${escapeHTML(error.message)}</p>`;
  } finally {
    button.disabled = false;
    button.textContent = "TRACK MY ORDER";
  }
});

const params = new URLSearchParams(window.location.search);
if (params.get("reference")) {
  document.getElementById("reference").value = params.get("reference");
}
</script>
</body>
</html>
